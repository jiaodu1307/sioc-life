<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫猫图鉴 - SIOC生活指南</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/cats.css">
    <link rel="stylesheet" href="../assets/css/comments.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回首页
            </a>
            <h1>猫猫图鉴</h1>
            <div style="width: 80px;"></div>
        </div>
    </header>

    <main class="container">
        <section class="cat-section fade-element">
            <h2 class="section-title">猫猫们（点击图片可查看大图）</h2>
            <div class="cat-grid">
                <!-- Data will be loaded by cats.js -->
                <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">
                    加载中...
                </div>
            </div>
        </section>

        <section class="cat-section fade-element">
            <h2 class="section-title">注意事项</h2>
            <ul>
                <li>请勿随意投喂人类食物，可能对猫猫健康有害。</li>
                <li>观察即可，请勿强行撸猫或追逐，尊重猫猫意愿。</li>
                <li>如发现受伤或状态异常的猫猫，可联系园区猫猫群。</li>
            </ul>
        </section>
    </main>

    <!-- 评论与讨论区域 -->
    <section class="comments-section container">
        <div class="comments-container">
            <h3 class="comments-title">💬 评论与讨论</h3>
            <div id="giscus-container">
                <script src="https://giscus.app/client.js"
                        data-repo="jiaodu1307/sioc-life"
                        data-repo-id="R_kgDOOV7PfQ"
                        data-category="General"
                        data-category-id="DIC_kwDOOV7Pfc4CxHjU"
                        data-mapping="pathname"
                        data-strict="0"
                        data-reactions-enabled="1"
                        data-emit-metadata="0"
                        data-input-position="bottom"
                        data-theme="preferred_color_scheme"
                        data-lang="zh-CN"
                        crossorigin="anonymous"
                        async>
                </script>
            </div>
            <div class="comments-info">
                <p>🐱 分享你遇到的猫猫、投喂经历或者补充猫猫信息</p>
                <p>💡 需要GitHub账号登录才能评论</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2024 SIOC生活指南 - 猫猫图鉴</p>
    </footer>

    <!-- 页面小宠物元素 -->
    <div class="page-pet">🐾</div>
    <button id="backToTopBtn" title="回到顶部">↑</button>

    <!-- 模态框 HTML -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/cats.js"></script>

</body>
</html>
