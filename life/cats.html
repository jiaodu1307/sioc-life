<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫猫图鉴 - SIOC生活指南</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/cats.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../index.html" class="back-link">← 返回首页</a>
            <h1>猫猫图鉴</h1>
            <div></div> <!-- 用于对齐标题 -->
        </div>
    </header>

    <main class="container">
        <section class="cat-section">
            <h2 class="section-title">猫猫们（点击图片可查看大图）</h2>
            <div class="cat-grid" id="cat-grid-container">
                <!-- Cat cards will be dynamically inserted here -->
            </div>
        </section>

        <!-- 可以添加其他区域，例如“投喂指南”、“注意事项”等 -->
        <section class="cat-section">
            <h2 class="section-title">注意事项</h2>
            <ul>
                <li>请勿随意投喂人类食物，可能对猫猫健康有害。</li>
                <li>观察即可，请勿强行撸猫或追逐，尊重猫猫意愿。</li>
                <li>如发现受伤或状态异常的猫猫，可联系园区猫猫群。
                    <!-- 二维码图片已移除 -->
                </li>
            </ul>
        </section>
    </main>

    <footer>
        <p>© 2024 SIOC生活指南 - 猫猫图鉴</p>
    </footer>

    <!-- 页面小宠物元素 -->
    <div class="page-pet">🐾</div>

    <!-- 新增：模态框 HTML -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script src="../assets/js/cats.js"></script>

</body>
</html>
