<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住宿指南 - SIOC生活指南</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/accommodation.css">
    <link rel="stylesheet" href="../assets/css/comments.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回首页
            </a>
            <h1>住宿指南</h1>
            <div style="width: 80px;"></div>
        </div>
    </header>

    <main class="container">
        <div class="tips fade-element">
            <strong>温馨提示：</strong>点击下列宿舍图片/名称可跳转至下方页面查看宿舍详细信息
        </div>
        <section class="accommodation-section fade-element">
            <h2 class="section-title">宿舍概览</h2>
            
            <div style="margin-bottom: 2rem;">
                <h3 style="font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-light);">所里宿舍</h3>
                <div id="inside-grid" class="dorm-grid">
                    <!-- Loaded by JS -->
                    <div style="grid-column: 1/-1; text-align: center;">加载中...</div>
                </div>
            </div>
            
            <div>
                <h3 style="font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-light);">所外宿舍</h3>
                <div id="outside-grid" class="dorm-grid">
                    <!-- Loaded by JS -->
                    <div style="grid-column: 1/-1; text-align: center;">加载中...</div>
                </div>
            </div>
        </section>

        <!-- Detailed sections will be inserted here by JS -->

        <!-- 评论与讨论区域 -->
        <section class="comments-section fade-element">
            <div class="comments-container">
                <h3 class="comments-title">💬 评论与讨论</h3>
                <div id="giscus-container">
                    <script src="https://giscus.app/client.js"
                            data-repo="jiaodu1307/sioc-life"
                            data-repo-id="R_kgDOOV7PfQ"
                            data-category="General"
                            data-category-id="DIC_kwDOOV7Pfc4CxHjU"
                            data-mapping="pathname"
                            data-strict="0"
                            data-reactions-enabled="1"
                            data-emit-metadata="0"
                            data-input-position="bottom"
                            data-theme="preferred_color_scheme"
                            data-lang="zh-CN"
                            crossorigin="anonymous"
                            async>
                    </script>
                </div>
                <div class="comments-info">
                    <p>💡 评论功能基于GitHub Discussions，需要GitHub账号登录</p>
                </div>
            </div>
        </section>
    </main>
    
    <button id="backToTopBtn" title="回到顶部">↑</button>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/accommodation.js"></script>
</body>
</html>
