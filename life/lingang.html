<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>临港新园区图集 - SIOC生活指南</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-sm);
            aspect-ratio: 4/3;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: var(--secondary-color);
        }
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        /* Modal for full screen image viewing */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.9); 
            backdrop-filter: blur(5px);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            object-fit: contain;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 2001;
        }
        .close-modal:hover,
        .close-modal:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="../index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回首页
            </a>
            <h1>临港新园区图集</h1>
            <div style="width: 80px;"></div>
        </div>
    </header>

    <main class="container">
        <section class="fade-element">
            <h2 class="section-title">临港新园区前瞻</h2>
            <p style="color: var(--text-light); margin-bottom: 2rem;">这里展示了上海有机所临港新园区的一些环境和建筑图片，带你提前了解未来的科研生活环境。点击图片可放大查看。</p>
            
            <div class="gallery-grid" id="gallery-grid">
                <!-- Images will be inserted by JS -->
            </div>
        </section>
    </main>

    <!-- Modal for full size image -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <button id="backToTopBtn" title="回到顶部">↑</button>
    <script src="../assets/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const images = [
                "IMG_20260306_115311.jpg",
                "IMG_20260306_120136.jpg",
                "IMG_20260306_120158.jpg",
                "IMG_20260306_120201.jpg",
                "IMG_20260306_120209.jpg",
                "IMG_20260306_120248.jpg",
                "IMG_20260306_120317.jpg",
                "IMG_20260306_120347.jpg",
                "IMG_20260306_120916.jpg",
                "IMG_20260306_121001.jpg",
                "IMG_20260306_121023.jpg",
                "IMG_20260306_121046.jpg",
                "IMG_20260306_121110.jpg",
                "IMG_20260306_121224.jpg",
                "IMG_20260306_121304.jpg",
                "IMG_20260306_121319.jpg",
                "IMG_20260306_121627.jpg",
                "IMG_20260306_121637.jpg",
                "IMG_20260306_121948.jpg",
                "IMG_20260306_121951.jpg",
                "IMG_20260306_122052.jpg",
                "IMG_20260306_122058.jpg",
                "IMG_20260306_122558.jpg",
                "IMG_20260306_122843.jpg",
                "IMG_20260306_123003.jpg",
                "IMG_20260306_123115.jpg",
                "IMG_20260306_123408.jpg",
                "IMG_20260306_123414.jpg"
            ];
            
            const grid = document.getElementById('gallery-grid');
            const modal = document.getElementById('imageModal');
            const fullImage = document.getElementById('fullImage');
            const closeModal = document.querySelector('.close-modal');

            images.forEach(img => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                
                const imgEl = document.createElement('img');
                imgEl.src = `../assets/images/lingang/${img}`;
                imgEl.alt = '临港新园区';
                imgEl.loading = 'lazy';
                
                item.appendChild(imgEl);
                grid.appendChild(item);

                item.addEventListener('click', () => {
                    modal.style.display = 'block';
                    fullImage.src = imgEl.src;
                });
            });

            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
